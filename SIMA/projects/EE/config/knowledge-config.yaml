project:
  name: "EE"
  description: "Execution Engine with Universal Gateway pattern for cross-component coordination"
  version: "v2025.12.31.1"
  created: "2025-12-31"
  type: "execution-engine"

knowledge:
  generic:
    enabled: true
    categories:
      - lessons
      - decisions
      - anti-patterns
      - architecture
      - specifications
  
  platforms:
    generic:
      enabled: true
      note: "Platform-agnostic execution engine"
  
  languages:
    python:
      enabled: true
      architectures:
        universal-gateway: true
        domain-gateway: true
        interface-isolation: true
        factory-pattern: true

context:
  modes:
    - general
    - learning
    - maintenance
    - project
    - debug
  
  custom_instructions: true

  constraints:
    - "Interface isolation: Interfaces cannot import outside their package"
    - "Single execution authority: UG is the only entry point"
    - "Direct execution: Factories are execution units, no extra wrappers"
  
  capabilities:
    - "Cross-component coordination via gateway pattern"
    - "Dynamic route-based operation execution"
    - "Domain-specific gateway routing"
    - "Isolated interface modules"
    - "Factory-based execution units"

file_access:
  include_paths:
    - "/sima/generic/**"
    - "/sima/languages/python/**"
    - "/sima/projects/EE/**"
  
  exclude_paths:
    - "/sima/platforms/aws/**"
    - "/sima/platforms/azure/**"
    - "/sima/platforms/gcp/**"
