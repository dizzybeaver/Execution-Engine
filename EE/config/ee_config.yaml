# EE Configuration File
# Execution Engine - Universal configuration system with 150+ variables
# Supports multiple profiles: development, testing, staging, production

profile: development  # development | testing | staging | production

# =============================================================================
# CORE FOUNDATION SETTINGS
# =============================================================================

core:
  singleton:
    # Singleton instance management
    enabled: true
    track_memory: true
    max_instances: 1000
    cleanup_interval: 300  # seconds

  utility:
    # Utility functions configuration
    json_encoder: "default"  # default | custom
    uuid_version: 4  # UUID version (1, 4)
    template_engine: "jinja2"  # jinja2 | mako | simple

  config:
    # Configuration management
    hot_reload: true
    reload_interval: 60  # seconds
    config_path: "./config/ee_config.yaml"
    profile_path: "./config/profiles/"

# =============================================================================
# OBSERVABILITY SETTINGS
# =============================================================================

observability:
  logging:
    # Structured logging
    enabled: true
    level: "INFO"  # DEBUG | INFO | WARNING | ERROR | CRITICAL
    format: "json"  # json | text
    cloudwatch: true
    log_group: "EE-Logs"
    log_stream: "EE-Stream"
    retention_days: 7

  metrics:
    # Performance metrics
    enabled: true
    cloudwatch: true
    namespace: "EE/Metrics"
    dimension_name: "EEInstance"
    flush_interval: 60  # seconds
    batch_size: 20

  debug:
    # Debug logging and diagnostics
    enabled: true
    verbose: false
    trace_operations: false
    correlation_id: true
    timing_measurements: true

# =============================================================================
# SECURITY SETTINGS
# =============================================================================

security:
  validation:
    # Input validation
    enabled: true
    max_string_length: 10000
    max_array_length: 1000
    sanitize_html: true
    validate_email: true
    validate_url: true

  encryption:
    # Data encryption
    enabled: true
    algorithm: "AES-256-GCM"
    key_manager: "ssm"  # ssm | env | file
    rotation_days: 90

  authentication:
    # Authentication (future)
    enabled: false
    provider: "none"  # oauth2 | jwt | none
    token_expiry: 3600  # seconds

# =============================================================================
# COMMUNICATION SETTINGS
# =============================================================================

communication:
  http_client:
    # REST API client
    enabled: true
    timeout: 30  # seconds
    max_retries: 3
    retry_backoff: 1.0  # seconds
    connection_pool_size: 10
    verify_ssl: true

  websocket:
    # WebSocket client
    enabled: true
    ping_interval: 20  # seconds
    ping_timeout: 10  # seconds
    max_message_size: 1048576  # 1MB
    auto_reconnect: true
    reconnect_delay: 5  # seconds

  network:
    # Network operations
    enabled: true
    dns_cache_ttl: 300  # seconds
    connection_timeout: 10  # seconds
    read_timeout: 30  # seconds

# =============================================================================
# OPERATIONS SETTINGS
# =============================================================================

operations:
  cache:
    # Caching operations
    enabled: true
    backend: "memory"  # memory | redis | memcached
    max_size_mb: 50
    ttl: 3600  # seconds (default TTL)
    eviction_policy: "lru"  # lru | lfu | fifo
    warming_enabled: true

  circuit_breaker:
    # Circuit breaker
    enabled: true
    failure_threshold: 5
    recovery_timeout: 60  # seconds
    half_open_max_calls: 3
    timeout: 30  # seconds

  fileio:
    # File I/O operations
    enabled: true
    base_path: "./data/"
    max_file_size_mb: 100
    allowed_extensions: [".json", ".txt", ".csv", ".yaml"]
    chunk_size: 8192  # bytes

  serialization:
    # Data serialization
    enabled: true
    default_format: "json"  # json | pickle | yaml | msgpack
    json_indent: 2
    json_sort_keys: false

  template:
    # Template operations
    enabled: true
    cache_templates: true
    auto_reload: false  # development only
    template_path: "./templates/"

  object_pool:
    # Object pooling (INT-18)
    enabled: true
    default_size: 10
    max_size: 100
    strategy: "fifo"  # fifo | lifo | priority | round_robin
    cleanup_interval: 300  # seconds

  di:
    # Dependency Injection
    enabled: true
    auto_discovery: false
    validate_graph: true
    circular_dependency_check: true
    visualization_enabled: true

# =============================================================================
# INFRASTRUCTURE SETTINGS
# =============================================================================

infrastructure:
  initialization:
    # System bootstrap
    enabled: true
    parallel_init: false
    init_timeout: 30  # seconds

  diagnosis:
    # Health checks
    enabled: true
    check_interval: 300  # seconds
    timeout: 10  # seconds
    failure_threshold: 3

  test:
    # Testing framework
    enabled: true
    parallel_execution: false
    coverage_target: 80  # percent
    timeout: 60  # seconds

  plugins:
    # Plugin system (INT-16)
    enabled: true
    plugin_path: "./plugins/"
    hot_reload: true
    sandbox_enabled: true
    max_plugins: 50
    validation_strict: true
    dependency_check: true

  threading:
    # Thread pool management
    enabled: false  # Lambda is single-threaded
    max_workers: 4
    thread_timeout: 300  # seconds
    queue_size: 1000

# =============================================================================
# OPTIMIZATION SETTINGS
# =============================================================================

optimization:
  zafp:
    # Zero-Abstraction Fast Path
    enabled: true
    operations: ["get", "set", "delete"]
    threshold_ns: 1000  # nanoseconds

  zaph:
    # Zero-Abstraction Performance Hot-path
    enabled: true
    cache_size: 1000
    invalidate_on_write: true

# =============================================================================
# AWS SPECIFIC SETTINGS
# =============================================================================

aws:
  region: "us-east-1"
  lambda:
    memory_mb: 128
    timeout_sec: 30
    reserved_concurrent_executions: -1  # -1 = unreserved

  ssm:
    enabled: true
    parameter_prefix: "/ee/"
    decryption: true

  cloudwatch:
    logs: true
    metrics: true
    alarms: true

# =============================================================================
# FEATURE FLAGS
# =============================================================================

features:
  # Enable/disable features at runtime
  plugins_enabled: true
  caching_enabled: true
  metrics_enabled: true
  debug_enabled: true
  hot_reload_enabled: true
  object_pool_enabled: true
  di_enabled: true
  threading_enabled: false  # Lambda single-threaded

# =============================================================================
# PROFILE OVERRIDES
# =============================================================================

# Development profile overrides
development:
  observability:
    logging:
      level: "DEBUG"
    debug:
      verbose: true
  operations:
    template:
      auto_reload: true
  features:
    debug_enabled: true

# Testing profile overrides
testing:
  observability:
    logging:
      level: "WARNING"
  infrastructure:
    test:
      parallel_execution: true
  features:
    debug_enabled: false

# Staging profile overrides
staging:
  observability:
    logging:
      level: "INFO"
    debug:
      verbose: false
  features:
    debug_enabled: false

# Production profile overrides
production:
  observability:
    logging:
      level: "WARNING"
    debug:
      enabled: false
      verbose: false
  operations:
    template:
      auto_reload: false
  infrastructure:
    plugins:
      hot_reload: false
      validation_strict: true
  features:
    debug_enabled: false
    hot_reload_enabled: false

# =============================================================================
# CUSTOM CONFIGURATION
# =============================================================================

# Add custom configuration variables here
custom:
  # FaaS Plugin Configuration
  faas:
    enabled: true
    port: 5001
    host: "0.0.0.0"
    debug: false
    workers: 1
    entity_cache_enabled: true
    entity_cache_ttl: 300  # seconds
    auto_discover_on_start: true
    home_assistant:
      url: null  # Set via environment or SSM
      token: null  # Set via environment or SSM
      websocket_enabled: true
      connection_timeout: 30  # seconds
